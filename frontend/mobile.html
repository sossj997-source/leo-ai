<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Leo</title>
<style>
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --siri-blue: #1E90FF;
    --siri-purple: #8A2BE2;
    --siri-pink: #FF1493;
    --siri-cyan: #00FFFF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background-color: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* --- TOP BAR --- */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.4);
    z-index: 10;
    letter-spacing: 1px;
  }

  /* --- SIRI ORB AREA --- */
  .orb-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: opacity 0.5s;
  }

  /* Jab mic sun raha ho toh orb hile */
  .orb-area.listening .siri-orb {
    animation: spin 2s linear infinite, breathe 0.8s ease-in-out infinite alternate;
    filter: blur(20px);
    box-shadow: 0 0 80px rgba(255, 20, 147, 0.6); /* Pink glow when listening */
  }

  .siri-orb {
    width: 160px;
    height: 160px;
    position: relative;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      var(--siri-blue),
      var(--siri-purple),
      var(--siri-pink),
      var(--siri-cyan),
      var(--siri-blue)
    );
    filter: blur(15px);
    animation: spin 4s linear infinite, breathe 3s ease-in-out infinite alternate;
    box-shadow: 0 0 60px rgba(138, 43, 226, 0.4);
    transition: all 0.4s ease;
  }

  .siri-core {
    position: absolute;
    width: 80%; height: 80%;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 50%;
    backdrop-filter: blur(10px);
    z-index: 2;
    display: flex; align-items: center; justify-content: center;
  }
  
  .siri-core::after {
    content: '';
    width: 20px; height: 20px;
    background: #fff; border-radius: 50%;
    box-shadow: 0 0 20px #fff, 0 0 40px var(--siri-cyan);
    animation: pulse 2s infinite;
  }

  .greeting {
    margin-top: 40px;
    font-size: 15px; font-weight: 400;
    color: rgba(255, 255, 255, 0.6);
    text-align: center; letter-spacing: 0.5px;
    z-index: 2;
    transition: color 0.3s;
  }

  .orb-area.listening .greeting {
    color: var(--siri-pink);
  }

  /* --- CHAT AREA --- */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 0;
    scroll-behavior: smooth;
  }
  .chat-area::-webkit-scrollbar { display: none; }

  .msg {
    max-width: 85%;
    font-size: 14px;
    line-height: 1.5;
    padding: 14px 18px;
    position: relative;
    word-break: break-word;
    animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    backdrop-filter: blur(10px);
  }

  .msg.user {
    align-self: flex-end;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-left: 3px solid var(--siri-pink);
    border-radius: 4px 12px 12px 12px;
    color: #fff;
    text-align: left;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
  }
  .msg.user::after {
    content: 'SIRR';
    display: block; font-size: 9px; color: var(--siri-pink);
    letter-spacing: 2px; margin-bottom: 4px; font-weight: 700;
  }

  .msg.leo {
    align-self: flex-start;
    background: linear-gradient(180deg, rgba(138, 43, 226, 0.15) 0%, rgba(0, 0, 0, 0.2) 100%);
    border: 1px solid rgba(138, 43, 226, 0.3);
    border-left: 3px solid var(--siri-cyan);
    border-radius: 12px 4px 12px 12px;
    color: #e0e0e0;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.1), inset 0 0 15px rgba(138, 43, 226, 0.1);
  }
  .msg.leo::after {
    content: '✦ LEO';
    display: block; font-size: 9px; color: var(--siri-cyan);
    letter-spacing: 2px; margin-bottom: 4px; font-weight: 700;
  }

  /* --- COMPOSER (Bottom Box) --- */
  .input-area {
    padding: 10px 20px calc(env(safe-area-inset-bottom, 0px) + 20px) 20px;
    background: linear-gradient(to top, #000 40%, transparent);
    display: flex;
    gap: 12px;
    align-items: flex-end;
    z-index: 10;
  }

  .composer-inner {
    display: flex;
    flex: 1;
    align-items: flex-end;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 24px;
    padding: 6px 6px 6px 18px;
    transition: all 0.3s var(--ease);
  }
  
  .composer-inner:focus-within {
    border-color: var(--siri-purple);
    box-shadow: 0 0 20px rgba(138, 43, 226, 0.2);
    background: rgba(255, 255, 255, 0.12);
  }

  .input-box {
    flex: 1;
    background: transparent;
    border: none;
    color: #fff;
    font-size: 15px;
    outline: none;
    resize: none;
    max-height: 100px;
    font-family: inherit;
    line-height: 1.5;
    padding: 8px 0;
  }
  .input-box::placeholder { color: rgba(255, 255, 255, 0.3); }

  /* Send Button */
  .btn-send {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: #fff;
    color: #000;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
    margin-left: 8px;
    margin-bottom: 2px;
  }
  
  .btn-send:disabled {
    opacity: 0.5;
    background: rgba(255,255,255,0.2);
    color: rgba(0,0,0,0.5);
  }

  /* --- MIC BUTTON & ANIMATION --- */
  .mic-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-mic {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    color: var(--siri-cyan);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    flex-shrink: 0;
    border: 1px solid rgba(255, 255, 255, 0.1);
    z-index: 2;
  }

  .btn-mic svg {
    width: 22px; height: 22px;
    transition: all 0.3s ease;
  }

  .btn-mic.listening { 
    background: var(--siri-pink);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 0 20px var(--siri-pink);
  }

  /* Pulse Ring Animation */
  .pulse-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 2px solid var(--siri-pink);
    opacity: 0;
    z-index: 1;
    pointer-events: none;
  }

  .btn-mic.listening ~ .pulse-ring {
    animation: ripple 1.5s infinite cubic-bezier(0.2, 0.8, 0.4, 1);
  }

  /* Animations */
  @keyframes ripple {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
    100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
  }

  @keyframes slideIn { from{opacity:0;transform:translateX(-10px);} to{opacity:1;transform:none;} }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  @keyframes breathe { 
    0% { transform: scale(1); filter: blur(15px); } 
    100% { transform: scale(1.15); filter: blur(20px); } 
  }
  @keyframes pulse { 
    0%, 100% { opacity: 1; transform: scale(1); } 
    50% { opacity: 0.5; transform: scale(0.8); } 
  }
</style>
</head>
<body>

  <div class="top-bar">
    <div>Leo AI</div>
    <div id="time">--:--</div>
  </div>

  <div class="orb-area" id="orbArea">
    <div class="siri-orb">
      <div class="siri-core"></div>
    </div>
    <div class="greeting" id="greeting">Bolo Sirr...</div>
  </div>

  <div class="chat-area" id="chatArea"></div>

  <div class="input-area">
    
    <div class="composer-inner">
      <textarea class="input-box" id="chatInput" rows="1" placeholder="Message Leo..."></textarea>
      <button class="btn-send" id="sendBtn" disabled>↑</button>
    </div>

    <div class="mic-wrapper">
      <button class="btn-mic" id="micBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 10a7 7 0 0 0 14 0M12 19v3"/>
        </svg>
      </button>
      <div class="pulse-ring"></div>
      <div class="pulse-ring" style="animation-delay: 0.5s;"></div>
      <div class="pulse-ring" style="animation-delay: 1s;"></div>
    </div>

  </div>

<script>
  const API = 'https://leo-ai-fb31.onrender.com';
  let sessionId = null;
  let isProcessing = false;
  let recognition = null;
  let isListening = false;

  const chatArea = document.getElementById('chatArea');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const orbArea = document.getElementById('orbArea');
  const greeting = document.getElementById('greeting');

  setInterval(() => {
    const d = new Date();
    document.getElementById('time').textContent = 
      `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }, 1000);

  chatInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = (this.scrollHeight) + 'px';
    
    if (this.value.trim().length > 0 && !isProcessing) {
      sendBtn.disabled = false;
    } else {
      sendBtn.disabled = true;
    }
  });

  function addMsg(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    const textNode = document.createTextNode(text);
    div.appendChild(textNode);
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return div;
  }

  function setProcessing(active) {
    isProcessing = active;
    if (active) {
      greeting.textContent = 'Thinking...';
      sendBtn.disabled = true;
    } else {
      greeting.textContent = 'Bolo Sirr...';
      if (chatInput.value.trim().length > 0) {
        sendBtn.disabled = false;
      }
    }
  }

  async function sendMessage(text) {
    if (!text.trim() || isProcessing) return;
    orbArea.style.display = 'none';
    
    addMsg('user', text);
    chatInput.value = '';
    chatInput.style.height = 'auto';
    sendBtn.disabled = true;
    setProcessing(true);

    const leoMsg = addMsg('leo', '...');

    try {
      const res = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });
      
      if (!res.ok) throw new Error('Network error');
      const data = await res.json();
      sessionId = data.session_id;
      
      leoMsg.textContent = data.response || '...';
      chatArea.scrollTop = chatArea.scrollHeight;

      if (data.response) {
        playTTS(data.response);
      }

    } catch (e) {
      leoMsg.textContent = 'Connection lost.';
    } finally {
      setProcessing(false);
    }
  }

  async function playTTS(text) {
    try {
      const res = await fetch(`${API}/tts`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text.slice(0, 500) }),
      });
      if (!res.ok) return;
      const data = await res.json();
      if (data.audio) {
        const audio = new Audio('data:audio/mpeg;base64,' + data.audio);
        audio.play();
      }
    } catch (e) {
      console.log('TTS error:', e);
    }
  }

  sendBtn.addEventListener('click', () => sendMessage(chatInput.value));
  
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) {
        sendMessage(chatInput.value);
      }
    }
  });

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = true; 
    recognition.lang = 'en-IN';

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
      orbArea.classList.add('listening'); // Orb animation start
      greeting.textContent = 'Listening...';
      orbArea.style.display = 'flex';
    };

    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
      orbArea.classList.remove('listening'); // Orb animation stop
      greeting.textContent = 'Bolo Sirr...';
    };

    recognition.onresult = (event) => {
      let interimText = '';
      let finalText = '';

      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          finalText += transcript;
        } else {
          interimText += transcript;
        }
      }

      if (interimText) {
        chatInput.value = interimText.trim();
        chatInput.dispatchEvent(new Event('input'));
      }

      if (finalText) {
        let cleanText = finalText.replace(/\b(leo|lio|liyo)\b[,.!?]?/gi, '').trim();
        chatInput.value = ''; 
        if (cleanText.length > 1) {
           sendMessage(cleanText);
        }
      }
    };

    micBtn.addEventListener('click', () => {
      if (isListening) recognition.stop();
      else recognition.start();
    });
  } else {
    micBtn.style.display = 'none';
    console.log('Speech Recognition not supported');
  }
</script>
</body>
</html>
