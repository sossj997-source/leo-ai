<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Leo Mobile</title>
<style>
  :root {
    --accent: #00d4aa;
    --accent-bright: #00ffcc;
    --bg: #000;
    --fg: #e0e0e0;
    --muted: #666;
    --mono: 'Consolas', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    height: 100dvh; /* Mobile browser address bar fix */
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* --- TOP BAR --- */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 24px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 2px;
    z-index: 10;
  }
  .status-dot { display: flex; align-items: center; gap: 6px; }
  .status-dot::before { content: '●'; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  /* --- LIQUID ORB AREA --- */
  .orb-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    /* Blue background ki jagah dark green glow */
    background: radial-gradient(circle at center, rgba(0, 212, 170, 0.08) 0%, transparent 60%);
    overflow: hidden;
  }

  .liquid-orb {
    width: 260px;
    height: 260px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Glow shadow */
    filter: drop-shadow(0 0 40px rgba(0, 212, 170, 0.3));
  }

  /* Base Blob */
  .blob {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #00d4aa, #004d3d);
    border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
    animation: morph 6s ease-in-out infinite;
    box-shadow: inset 0 0 30px rgba(0, 255, 204, 0.6);
    z-index: 1;
  }

  /* Overlay Blob (darker, contrast ke liye) */
  .blob:nth-child(2) {
    background: linear-gradient(225deg, #00ffcc, #001a15);
    animation: morph2 8s ease-in-out infinite;
    opacity: 0.6;
    z-index: 2;
    mix-blend-mode: screen;
  }

  /* Center Star */
  .sparkle {
    position: relative;
    z-index: 10;
    color: #fff;
    font-size: 32px;
    text-shadow: 0 0 20px #00ffcc, 0 0 40px #00d4aa;
    animation: pulseStar 2s ease-in-out infinite;
  }

  /* Animations for Liquid shape shifting */
  @keyframes morph {
    0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: rotate(0deg) scale(1); }
    34% { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; transform: rotate(120deg) scale(1.05); }
    67% { border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%; transform: rotate(240deg) scale(0.95); }
  }

  @keyframes morph2 {
    0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; transform: rotate(0deg) scale(1.1); }
    50% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; transform: rotate(-180deg) scale(0.9); }
  }

  @keyframes pulseStar {
    0%, 100% { opacity: 0.8; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  /* Greeting text under orb */
  .greeting {
    margin-top: 30px;
    font-size: 15px;
    font-weight: 300;
    color: #fff;
    text-align: center;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(0, 212, 170, 0.5);
    z-index: 10;
  }

  /* --- CHAT AREA --- */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
  }
  .chat-area::-webkit-scrollbar { display: none; } /* Hide scrollbar mobile */

  .msg {
    max-width: 85%;
    font-size: 13px;
    line-height: 1.5;
    padding: 10px 14px;
    border-radius: 14px;
    word-break: break-word;
    animation: fadeUp 0.2s ease-out;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(5px);} to{opacity:1;transform:none;} }

  .msg.user {
    align-self: flex-end;
    background: rgba(0, 212, 170, 0.15);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .msg.leo {
    align-self: flex-start;
    background: rgba(255, 255, 255, 0.05);
    color: #e0e0e0;
    border-bottom-left-radius: 4px;
  }

  /* --- INPUT AREA --- */
  .input-area {
    padding: 12px 16px 24px 16px;
    background: #000;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .input-box {
    flex: 1;
    background: #111;
    border: 1px solid #333;
    border-radius: 20px;
    padding: 12px 16px;
    color: #fff;
    font-size: 14px;
    outline: none;
    resize: none;
    max-height: 100px;
    font-family: inherit;
  }
  .input-box:focus { border-color: var(--accent); }

  .btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    background: #111;
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .btn.send { background: var(--accent); color: #000; border: none; }
  .btn:active { transform: scale(0.95); }
  .btn.mic.listening { background: rgba(255, 85, 102, 0.2); color: #ff5566; animation: pulse 1.5s infinite; }
</style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="status-dot">ONLINE</div>
    <div id="time">--:--</div>
  </div>

  <!-- Center Area (Orb + Greeting) -->
  <div class="orb-area" id="orbArea">
    <div class="liquid-orb">
      <div class="blob"></div>
      <div class="blob"></div>
      <div class="sparkle">✦</div>
    </div>
    <div class="greeting" id="greeting">Bolo Sirr...</div>
  </div>

  <!-- Chat Area -->
  <div class="chat-area" id="chatArea"></div>

  <!-- Bottom Input Area -->
  <div class="input-area">
    <button class="btn mic" id="micBtn">🎤</button>
    <textarea class="input-box" id="chatInput" rows="1" placeholder="Message..."></textarea>
    <button class="btn send" id="sendBtn">↑</button>
  </div>

<script>
  const API = 'https://leo-ai-fb31.onrender.com';
  let sessionId = null;
  let isProcessing = false;
  let recognition = null;
  let isListening = false;

  const chatArea = document.getElementById('chatArea');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const orbArea = document.getElementById('orbArea');
  const greeting = document.getElementById('greeting');

  // Time
  setInterval(() => {
    const d = new Date();
    document.getElementById('time').textContent = 
      `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }, 1000);

  // Auto-resize textarea
  chatInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = (this.scrollHeight) + 'px';
  });

  // --- UI Helpers ---
  function addMsg(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.textContent = text;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return div;
  }

  function setProcessing(active) {
    isProcessing = active;
    if (active) {
      // Orb ko aur bright kardo jab soch raha ho
      orbArea.style.background = 'radial-gradient(circle at center, rgba(0, 212, 170, 0.2) 0%, transparent 70%)';
      greeting.textContent = 'Soch raha hoon...';
    } else {
      orbArea.style.background = 'radial-gradient(circle at center, rgba(0, 212, 170, 0.08) 0%, transparent 60%)';
      greeting.textContent = 'Bolo Sirr...';
    }
  }

  // --- Chat Logic ---
  async function sendMessage(text) {
    if (!text.trim() || isProcessing) return;
    
    // Chat dikhao, Orb area chota kardo
    orbArea.style.display = 'none';
    
    addMsg('user', text);
    chatInput.value = '';
    chatInput.style.height = 'auto';
    setProcessing(true);

    const leoMsg = addMsg('leo', '...');

    try {
      const res = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });
      
      if (!res.ok) throw new Error('Network error');
      
      const data = await res.json();
      sessionId = data.session_id;
      
      leoMsg.textContent = data.response || 'Kuch samajh nahi aaya.';
      chatArea.scrollTop = chatArea.scrollHeight;
      
    } catch (e) {
      leoMsg.textContent = 'Backend offline hai Sirr.';
    } finally {
      setProcessing(false);
    }
  }

  sendBtn.addEventListener('click', () => sendMessage(chatInput.value));
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage(chatInput.value);
    }
  });

  // --- Voice (Speech Recognition) ---
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.lang = 'en-IN';

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
      greeting.textContent = 'Sun raha hoon...';
    };

    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
      greeting.textContent = 'Bolo Sirr...';
    };

    recognition.onresult = (event) => {
      let finalText = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) finalText += event.results[i][0].transcript;
      }
      
      if (finalText) {
        // "Leo" word hata do agar user bole
        const text = finalText.replace(/leo/gi, '').trim();
        if (text.length > 1) {
          sendMessage(text);
        }
      }
    };

    micBtn.addEventListener('click', () => {
      if (isListening) recognition.stop();
      else recognition.start();
    });
  } else {
    micBtn.style.display = 'none';
  }
</script>
</body>
</html>
