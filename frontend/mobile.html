<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Leo</title>
<style>
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --siri-blue: #1E90FF;
    --siri-purple: #8A2BE2;
    --siri-pink: #FF1493;
    --siri-cyan: #00FFFF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background-color: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* --- TOP BAR --- */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.4);
    z-index: 10;
    letter-spacing: 1px;
  }

  /* --- SIRI ORB AREA --- */
  .orb-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: opacity 0.5s;
  }

  .siri-orb {
    width: 160px;
    height: 160px;
    position: relative;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      var(--siri-blue),
      var(--siri-purple),
      var(--siri-pink),
      var(--siri-cyan),
      var(--siri-blue)
    );
    filter: blur(15px);
    animation: spin 4s linear infinite, breathe 3s ease-in-out infinite alternate;
    box-shadow: 0 0 60px rgba(138, 43, 226, 0.4);
  }

  .siri-core {
    position: absolute;
    width: 80%;
    height: 80%;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 50%;
    backdrop-filter: blur(10px);
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .siri-core::after {
    content: '';
    width: 20px;
    height: 20px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 20px #fff, 0 0 40px var(--siri-cyan);
    animation: pulse 2s infinite;
  }

  .greeting {
    margin-top: 40px;
    font-size: 15px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.6);
    text-align: center;
    letter-spacing: 0.5px;
    z-index: 2;
  }

  /* --- CHAT AREA (Unique Hologram Style) --- */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 0;
    scroll-behavior: smooth;
  }
  .chat-area::-webkit-scrollbar { display: none; }

  .msg {
    max-width: 85%;
    font-size: 14px;
    line-height: 1.5;
    padding: 14px 18px;
    position: relative;
    word-break: break-word;
    animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    backdrop-filter: blur(10px);
  }

  .msg::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    border-radius: inherit;
  }

  /* User Message - Glass block with left accent */
  .msg.user {
    align-self: flex-end;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-left: 3px solid var(--siri-pink);
    border-radius: 4px 12px 12px 12px;
    color: #fff;
    text-align: left;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
  }
  .msg.user::after {
    content: 'SIRR';
    display: block;
    font-size: 9px;
    color: var(--siri-pink);
    letter-spacing: 2px;
    margin-bottom: 4px;
    font-weight: 700;
  }

  /* Leo Message - Holographic panel with glow */
  .msg.leo {
    align-self: flex-start;
    background: linear-gradient(180deg, rgba(138, 43, 226, 0.15) 0%, rgba(0, 0, 0, 0.2) 100%);
    border: 1px solid rgba(138, 43, 226, 0.3);
    border-left: 3px solid var(--siri-cyan);
    border-radius: 12px 4px 12px 12px;
    color: #e0e0e0;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.1), inset 0 0 15px rgba(138, 43, 226, 0.1);
  }
  .msg.leo::after {
    content: '✦ LEO';
    display: block;
    font-size: 9px;
    color: var(--siri-cyan);
    letter-spacing: 2px;
    margin-bottom: 4px;
    font-weight: 700;
  }

  /* --- MODERN CHAT COMPOSER: bottom area only --- */
  .input-area {
    padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
    background: linear-gradient(to top, #05060b 72%, rgba(5,6,11,0));
    display: flex;
    gap: 10px;
    align-items: flex-end;
    z-index: 10;
  }

  .composer-inner {
    display: flex;
    flex: 1;
    align-items: flex-end;
    gap: 6px;
    background: rgba(22, 25, 39, 0.88);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.13);
    border-radius: 26px;
    padding: 7px 8px 7px 17px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }

  .composer-inner:focus-within {
    border-color: rgba(120, 116, 255, 0.72);
    box-shadow: 0 0 0 3px rgba(120, 116, 255, 0.10), 0 8px 28px rgba(0,0,0,0.28);
    background: rgba(26, 29, 45, 0.96);
  }

  .input-box {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    color: #f7f7fb;
    font-size: 15px;
    outline: none;
    resize: none;
    max-height: 120px;
    font-family: inherit;
    line-height: 1.5;
    padding: 9px 0;
  }

  .input-box::placeholder { color: rgba(230, 232, 245, 0.43); }

  .btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid transparent;
    background: transparent;
    color: #c7c9e7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease;
    flex-shrink: 0;
  }

  .btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .btn:active { transform: scale(0.92); }

  .btn.send {
    background: linear-gradient(135deg, #a78bfa, #6366f1);
    color: #fff;
    width: 40px;
    height: 40px;
    font-size: 19px;
    margin: 0;
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.28);
  }

  .btn.send:disabled {
    opacity: 0.42;
    background: rgba(255,255,255,0.14);
    color: rgba(255,255,255,0.5);
    box-shadow: none;
  }

  .btn.mic.listening {
    color: #ff6bba;
    background: rgba(255, 107, 186, 0.12);
    animation: pulse 1.5s infinite;
  }

  @media (max-width: 480px) {
    .input-area { padding-left: 12px; padding-right: 12px; }
    .composer-inner { padding-left: 15px; }
  }

  /* Animations */
  @keyframes slideIn { from{opacity:0;transform:translateX(-10px);} to{opacity:1;transform:none;} }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  @keyframes breathe { 
    0% { transform: scale(1); filter: blur(15px); } 
    100% { transform: scale(1.15); filter: blur(20px); } 
  }
  @keyframes pulse { 
    0%, 100% { opacity: 1; transform: scale(1); } 
    50% { opacity: 0.5; transform: scale(0.8); } 
  }
</style>
</head>
<body>

  <div class="top-bar">
    <div>Leo AI</div>
    <div id="time">--:--</div>
  </div>

  <div class="orb-area" id="orbArea">
    <div class="siri-orb">
      <div class="siri-core"></div>
    </div>
    <div class="greeting" id="greeting">Bolo Sirr...</div>
  </div>

  <div class="chat-area" id="chatArea"></div>

  <div class="input-area">
    <div class="composer-inner">
      <textarea class="input-box" id="chatInput" rows="1" placeholder="Message Leo..."></textarea>
      <button class="btn mic" id="micBtn">🎤</button>
      <button class="btn send" id="sendBtn" disabled>↑</button>
    </div>
  </div>

<script>
  const API = 'https://leo-ai-fb31.onrender.com';
  let sessionId = null;
  let isProcessing = false;
  let recognition = null;
  let isListening = false;

  const chatArea = document.getElementById('chatArea');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const orbArea = document.getElementById('orbArea');
  const greeting = document.getElementById('greeting');

  setInterval(() => {
    const d = new Date();
    document.getElementById('time').textContent = 
      `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }, 1000);

  chatInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = (this.scrollHeight) + 'px';
    
    // Send button enable/disable logic
    if (this.value.trim().length > 0 && !isProcessing) {
      sendBtn.disabled = false;
    } else {
      sendBtn.disabled = true;
    }
  });

  function addMsg(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    const textNode = document.createTextNode(text);
    div.appendChild(textNode);
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return div;
  }

  function setProcessing(active) {
    isProcessing = active;
    if (active) {
      greeting.textContent = 'Thinking...';
      sendBtn.disabled = true;
    } else {
      greeting.textContent = 'Bolo Sirr...';
      // Re-enable if there's text
      if (chatInput.value.trim().length > 0) {
        sendBtn.disabled = false;
      }
    }
  }

  async function sendMessage(text) {
    if (!text.trim() || isProcessing) return;
    orbArea.style.display = 'none';
    
    addMsg('user', text);
    chatInput.value = '';
    chatInput.style.height = 'auto';
    sendBtn.disabled = true;
    setProcessing(true);

    const leoMsg = addMsg('leo', '...');

    try {
      const res = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });
      
      if (!res.ok) throw new Error('Network error');
      const data = await res.json();
      sessionId = data.session_id;
      
      leoMsg.textContent = data.response || '...';
      chatArea.scrollTop = chatArea.scrollHeight;
    } catch (e) {
      leoMsg.textContent = 'Connection lost.';
    } finally {
      setProcessing(false);
    }
  }

  sendBtn.addEventListener('click', () => sendMessage(chatInput.value));
  
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) {
        sendMessage(chatInput.value);
      }
    }
  });

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.lang = 'en-IN';

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
      greeting.textContent = 'Listening...';
      orbArea.style.display = 'flex';
    };

    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
      greeting.textContent = 'Bolo Sirr...';
    };

    recognition.onresult = (event) => {
      let finalText = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) finalText += event.results[i][0].transcript;
      }
      if (finalText) {
        const text = finalText.replace(/\b(leo|lio|liyo)\b[,.!?]?/gi, '').trim();
        if (text.length > 1) sendMessage(text);
      }
    };

    micBtn.addEventListener('click', () => {
      if (isListening) recognition.stop();
      else recognition.start();
    });
  } else {
    micBtn.style.display = 'none';
  }
</script>
</body>
</html>
